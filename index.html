<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajustes Razonables · Aspaen Alcázares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F3F6FA; --card:#FFFFFF; --ink:#16232E; --ink-soft:#5B6B78; --line:#DCE4EC;
    --navy:#0E4B5E; --blue:#146B85; --blue-soft:#E1F4F7; --teal:#2FB0C8;
    --amber:#B8863B; --amber-soft:#F7EEDD; --green:#3F7A5C; --green-soft:#E7F1EA;
    --red:#B4483F; --red-soft:#F8E9E7; --purple:#5B4E8C; --purple-soft:#EBE8F5;
    --radius:10px; --shadow:0 1px 2px rgba(18,44,77,0.06), 0 6px 20px rgba(18,44,77,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  .app-header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{
    width:50px;height:50px;border-radius:12px; background:linear-gradient(155deg, var(--navy) 0%, var(--blue) 100%);
    display:flex;align-items:center;justify-content:center; color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:19px;
    flex-shrink:0; position:relative; box-shadow:var(--shadow); letter-spacing:-0.03em;
  }
  .brand-mark::after{content:''; position:absolute; inset:5px; border:1px solid rgba(255,255,255,0.35); border-radius:8px;}
  .brand-logo{height:40px; width:auto; display:block;}
  .brand-logo-print{height:44px; width:auto; display:block;}
  .brand-text h1{font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:0; color:var(--navy); letter-spacing:0.02em; text-transform:uppercase;}
  .brand-text .sub1{margin:1px 0 0; font-size:12.5px; color:var(--blue); font-weight:600;}
  .brand-text .sub2{margin:3px 0 0; font-size:12px; color:var(--ink-soft);}

  .tabs{display:flex; gap:4px; background:#E4EAF1; padding:4px; border-radius:10px;}
  .tab-btn{border:none; background:transparent; padding:9px 16px; border-radius:7px; font-family:'Inter'; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:all .15s ease; white-space:nowrap;}
  .tab-btn.active{background:var(--card); color:var(--navy); box-shadow:var(--shadow);}

  .layout{display:grid; grid-template-columns:220px 1fr; gap:24px; align-items:start;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}

  .rail{position:sticky; top:24px; display:flex; flex-direction:column; gap:2px;}
  .rail-step{display:flex; align-items:flex-start; gap:12px; padding:12px 10px; border-radius:8px; cursor:default; opacity:0.45;}
  .rail-step.enabled{opacity:1; cursor:pointer;}
  .rail-step.enabled:hover{background:#E9EEF5;}
  .rail-step.current{background:var(--blue-soft);}
  .rail-num{width:24px;height:24px;border-radius:50%; background:var(--line); color:var(--ink-soft); display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; margin-top:1px;}
  .rail-step.current .rail-num{background:var(--blue); color:#fff;}
  .rail-step.done .rail-num{background:var(--green); color:#fff;}
  .rail-label b{display:block; font-size:13.5px; color:var(--ink); font-weight:600;}
  .rail-label span{display:block; font-size:12px; color:var(--ink-soft); margin-top:1px;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .panel-body{padding:24px;}
  .panel-head{padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .panel-head h2{margin:0; font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--navy);}
  .panel-head p{margin:4px 0 0; font-size:13.5px; color:var(--ink-soft);}

  .student-bar{display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--navy); color:#fff; padding:14px 22px; border-radius:var(--radius); margin-bottom:18px; flex-wrap:wrap;}
  .student-bar .who b{font-size:15.5px; font-family:'Fraunces',serif; font-weight:600;}
  .student-bar .who span{display:block; font-size:12.5px; color:#B9CBE0; margin-top:2px;}
  .student-bar .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .student-bar button{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .student-bar button:hover{background:rgba(255,255,255,0.22);}

  .search-row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .search-input{flex:1; min-width:220px; padding:10px 14px; border:1px solid var(--line); border-radius:8px; font-family:'Inter'; font-size:14px; background:#FBFCFE;}
  .search-input:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .chip-row{display:flex; gap:7px; flex-wrap:wrap;}
  .chip{padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .chip.chip-dg{border-color:var(--amber); color:#8A6522; background:var(--amber-soft);}
  .chip.chip-dg.active{background:var(--amber); color:#fff;}

  .student-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px;}
  .student-card{text-align:left; border:1px solid var(--line); background:#fff; border-radius:9px; padding:13px 15px; cursor:pointer; transition:border-color .12s ease, transform .12s ease;}
  .student-card:hover{border-color:var(--blue); transform:translateY(-1px);}
  .student-card b{display:block; font-size:14px; color:var(--ink); font-weight:600;}
  .student-card .grp{display:inline-block; margin-top:6px; font-size:11px; font-weight:700; color:var(--navy); background:var(--blue-soft); padding:2px 8px; border-radius:5px;}
  .student-card .diag{display:block; margin-top:6px; font-size:12px; color:var(--ink-soft); line-height:1.4;}
  .empty-note{padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  .materia-grid{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:16px;}
  .materia-pill{padding:10px 16px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer;}
  .materia-pill:hover{border-color:var(--blue);}
  .materia-pill.selected{background:var(--blue); border-color:var(--blue); color:#fff;}
  .add-materia{display:flex; gap:8px; margin-top:6px;}
  .add-materia input{flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-family:'Inter'; font-size:13.5px;}
  .btn-ghost{padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:600; color:var(--navy); cursor:pointer;}
  .btn-ghost:hover{border-color:var(--navy);}

  .existing-note{background:var(--amber-soft); border:1px solid #E9D8B0; color:#7A5A1E; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px;}
  .pauta-group{border:1px solid var(--line); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .pauta-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 16px; background:#F3F6FA; cursor:pointer; user-select:none;}
  .pauta-head:hover{background:#EBF0F7;}
  .pauta-head .ph-left{display:flex; align-items:center; gap:10px;}
  .pauta-badge{width:24px;height:24px;border-radius:50%; background:var(--navy); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .pauta-head b{font-size:14px; font-weight:600; color:var(--ink);}
  .pauta-count{font-size:11.5px; font-weight:700; color:var(--blue); background:var(--blue-soft); padding:2px 9px; border-radius:12px;}
  .chevron{transition:transform .15s ease; color:var(--ink-soft);}
  .pauta-group.open .chevron{transform:rotate(90deg);}
  .pauta-body{display:none; padding:6px 16px 14px;}
  .pauta-group.open .pauta-body{display:block;}
  .sub-block{margin-top:12px;}
  .sub-block h4{margin:0 0 8px; font-size:12.5px; font-weight:700; color:var(--blue);}
  .item-row{display:flex; align-items:flex-start; gap:10px; padding:7px 8px; border-radius:6px;}
  .item-row:hover{background:#F3F6FA;}
  .item-row input{margin-top:3px; width:16px; height:16px; accent-color:var(--blue); cursor:pointer; flex-shrink:0;}
  .item-row.sugerido{background:var(--purple-soft); border-radius:6px;}
  .badge-sugerido{display:inline-block; background:var(--purple); color:#fff; font-size:10px; font-weight:700; padding:1px 7px; border-radius:8px; margin-left:6px; vertical-align:middle;}
  .item-row label{font-size:13.5px; color:var(--ink); cursor:pointer; line-height:1.45;}
  .item-row.hidden{display:none;}
  .item-wrap.hidden{display:none;}

  .pauta-group.eval-group{border-color:#E9D8B0;}
  .pauta-group.eval-group .pauta-head{background:var(--amber-soft);}
  .pauta-group.eval-group .pauta-head:hover{background:#F2E4C4;}
  .pauta-group.eval-group .pauta-badge{background:var(--amber);}
  .pauta-group.eval-group .pauta-count{background:#F2E4C4; color:#7A5A1E;}
  .pauta-group.eval-group .sub-block h4{color:#9A7228;}
  .pauta-group.eval-group .item-row input{accent-color:var(--amber);}

  /* DETAIL CARD (per selected ajuste) */
  .detail-card{margin:2px 8px 12px 34px; padding:12px 14px; background:#F8FAFD; border:1px solid var(--blue-soft); border-left:3px solid var(--blue); border-radius:0 8px 8px 0;}
  .detail-row{margin-bottom:8px;}
  .detail-row label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px;}
  .detail-row input[type=text], .detail-row textarea, .detail-row select{width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:6px; font-family:'Inter'; font-size:13px; background:#fff;}
  .detail-row textarea{min-height:44px; resize:vertical;}
  .detail-row-split{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .barrera-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .barrera-chip-mini{padding:5px 10px; border-radius:14px; border:1px solid var(--line); background:#fff; font-size:11.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .barrera-chip-mini.active{background:var(--purple); border-color:var(--purple); color:#fff;}
  .barrera-hint{font-size:12px; color:var(--ink-soft); font-style:italic;}
  .barrera-hint button{background:none; border:none; color:var(--blue); font-weight:600; font-size:12px; cursor:pointer; padding:0; text-decoration:underline;}

  .custom-block{border:1.5px dashed #C7D3DE; border-radius:9px; padding:16px; margin-top:14px; background:#FBFCFE;}
  .custom-block h4{margin:0 0 4px; font-size:14px; font-weight:600; color:var(--navy);}
  .custom-block p{margin:0 0 12px; font-size:12.5px; color:var(--ink-soft);}
  .custom-list{display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  .custom-item-head{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:1px solid var(--line); border-radius:7px 7px 0 0; padding:8px 12px; font-size:13px; font-weight:600;}
  .custom-item-head button{background:none; border:none; color:var(--red); font-size:16px; cursor:pointer; line-height:1; padding:0 2px;}
  .custom-item-wrap .detail-card{margin:0; border-radius:0 0 7px 7px; border-top:none;}
  .custom-add-row{display:flex; gap:8px;}
  .custom-add-row input{flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:'Inter';}

  .save-bar{position:sticky; bottom:0; margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .save-count{font-size:13.5px; color:var(--ink-soft);}
  .save-count b{color:var(--navy); font-size:15px;}
  .btn-primary{background:var(--blue); color:#fff; border:none; padding:11px 22px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Inter';}
  .btn-primary:hover{background:var(--navy);}
  .btn-primary:disabled{background:#B7C3D0; cursor:not-allowed;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 22px; border-radius:8px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,0.2); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .toast.err{background:var(--red);}

  .summary-toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .summary-stats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .stat-card{flex:1; min-width:150px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:14px 16px;}
  .stat-card .n{font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--navy); display:block;}
  .stat-card .l{font-size:12px; color:var(--ink-soft);}
  table.reg-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.reg-table th{text-align:left; padding:10px 12px; background:#F3F6FA; color:var(--ink-soft); font-weight:700; font-size:11.5px; border-bottom:1px solid var(--line);}
  table.reg-table td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.reg-table tr:hover td{background:#F8FAFC;}
  .tag-count{background:var(--green-soft); color:var(--green); font-weight:700; padding:2px 9px; border-radius:12px; font-size:11.5px;}
  .link-btn{background:none; border:none; color:var(--blue); font-weight:600; font-size:12.5px; cursor:pointer; padding:0; margin-right:10px;}
  .link-btn:hover{text-decoration:underline;}
  .empty-summary{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .empty-summary b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px; font-family:'Fraunces',serif;}
  .loading-note{padding:40px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .shared-note{font-size:11.5px; color:var(--ink-soft); margin-top:10px;}

  .piar-picker{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .piar-chip{padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:600; color:var(--navy); cursor:pointer;}
  .piar-chip:hover{border-color:var(--blue); background:var(--blue-soft);}
  .piar-chip span{color:var(--ink-soft); font-weight:500;}

  .barreras-cat{margin-bottom:16px;}
  .barreras-cat h4{margin:0 0 8px; font-size:13.5px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:8px;}
  .barreras-cat h4 .bc-count{font-size:11px; font-weight:700; color:var(--blue); background:var(--blue-soft); padding:1px 8px; border-radius:10px;}
  .barreras-notas{width:100%; min-height:80px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:'Inter'; font-size:13.5px; resize:vertical;}
  .barreras-meta{font-size:12px; color:var(--ink-soft); margin-top:8px;}

  /* CIERRE PANEL (secciones 6-7) */
  .cierre-section{margin-bottom:26px;}
  .cierre-section h3{font-family:'Fraunces',serif; font-size:16px; color:var(--navy); margin:0 0 4px;}
  .cierre-section .cierre-desc{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  .field-group{margin-bottom:14px;}
  .field-group label{display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:5px;}
  .field-group textarea, .field-group input[type=text]{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-family:'Inter'; font-size:13.5px;}
  .field-group textarea{min-height:64px; resize:vertical;}
  .subcard{background:#FBFCFE; border:1px solid var(--line); border-radius:9px; padding:16px; margin-bottom:12px;}
  .subcard h5{margin:0 0 10px; font-size:12.5px; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:0.03em;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid-4{display:grid; grid-template-columns:2fr 1.4fr 1fr 1.2fr; gap:10px;}
  @media (max-width:700px){.grid-4{grid-template-columns:1fr 1fr;}}
  select{padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:'Inter'; font-size:13px; background:#fff;}

  /* PRINTABLE PIAR VIEW */
  .piar-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .print-doc{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:40px 46px; max-width:820px; margin:0 auto;}
  .print-doc .p-head{display:flex; align-items:center; gap:16px; border-bottom:2px solid var(--navy); padding-bottom:18px; margin-bottom:22px;}
  .print-doc .p-head h1{font-family:'Fraunces',serif; font-size:19px; margin:0; color:var(--navy);}
  .print-doc .p-head .p-sub{font-size:12px; color:var(--blue); font-weight:600; margin-top:2px;}
  .print-doc .p-head .p-sub2{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .p-student-box{background:var(--blue-soft); border-radius:9px; padding:16px 18px; margin-bottom:24px;}
  .p-student-box h2{margin:0 0 4px; font-family:'Fraunces',serif; font-size:18px; color:var(--navy);}
  .p-student-box .p-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .p-section{margin-bottom:22px; page-break-inside:avoid;}
  .p-section h3{font-size:14.5px; color:#fff; background:var(--navy); display:inline-block; padding:5px 14px; border-radius:6px; margin:0 0 10px;}
  .p-section h3.amber{background:var(--amber);}
  .p-section h3.purple{background:var(--purple);}
  .p-list{margin:0 0 10px; padding-left:0; list-style:none;}
  .p-list li{font-size:13px; padding:5px 0 5px 20px; position:relative; border-bottom:1px dashed #EAEFF5;}
  .p-list li::before{content:'—'; position:absolute; left:0; color:var(--blue);}
  .p-ajuste-block{margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed #EAEFF5;}
  .p-ajuste-title{font-size:13px; font-weight:600;}
  .p-ajuste-meta{font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6;}
  .p-ajuste-impacto{font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-style:italic;}
  .p-sublabel{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 4px;}
  .p-ref{color:var(--ink-soft); font-size:11px; font-weight:500;}
  .p-footer{margin-top:38px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-soft); line-height:1.6;}
  .p-signatures{display:flex; gap:30px; margin-top:44px; flex-wrap:wrap;}
  .p-sig{flex:1; min-width:150px; text-align:center;}
  .p-sig .line{border-top:1px solid var(--ink-soft); margin-bottom:6px;}
  .p-sig .role{font-size:11.5px; color:var(--ink-soft);}
  .p-empty-materias{font-size:13px; color:var(--ink-soft); font-style:italic;}
  .p-rec-item{margin-bottom:10px;}
  .p-rec-item b{font-size:12.5px; color:var(--navy); display:block; margin-bottom:2px;}
  .p-rec-item span{font-size:13px;}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .app{padding:0; max-width:none;}
    .print-doc{border:none; box-shadow:none; padding:0; max-width:none;}
  }
</style>
</head>
<body>
<div class="app" id="app"><div class="loading-note">Cargando…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ====================== DATA ====================== */

, "text": "Uso de organizadores como por ejemplo mapas conceptuales."}, {"id": 49, "text": "Vincular conceptos (mediante analogías, metáforas u otras)."}]}, {"cod": "3.2", "titulo": "Destacar patrones, características fundamentales e ideas principales", "items": [{"id": 50, "text": "Resaltar las características críticas que distinguen a un concepto de otro."}, {"id": 51, "text": "Destacar las \"grandes ideas\" que organizan los ámbitos de la información."}, {"id": 52, "text": "Destacar o resaltar las relaciones entre los diferentes conceptos e ideas."}, {"id": 53, "text": "Resaltar las relaciones entre la nueva información y conocimientos previos para construir redes conceptuales."}, {"id": 54, "text": "Utilizar esquemas y organizadores gráficos para destacar ideas fundamentales y poner ejemplos/contraejemplos."}, {"id": 55, "text": "Utilice claves y apoyos de distinto tipo para llamar la atención de características críticas."}]}, {"cod": "3.3", "titulo": "Opciones que orientan el procesamiento de la información", "items": [{"id": 56, "text": "Ejemplos o estrategias variadas para estudiar una lección (textos, teatro, arte, películas, etc.)."}, {"id": 57, "text": "Fragmentación de la información en elementos más pequeños."}, {"id": 58, "text": "Múltiples puntos de entrada a la lección y vías opcionales de progreso a través del contenido."}, {"id": 59, "text": "Métodos y estrategias de organización (por ejemplo, tablas)."}, {"id": 60, "text": "Indicaciones explícitas de cada uno de los pasos que componen un proceso secuencial."}, {"id": 61, "text": "Modelos interactivos que guían la exploración e inspección."}, {"id": 62, "text": "Apoyos graduales para ir usando las estrategias de procesamiento de la información."}, {"id": 63, "text": "Modelos de cómo enfrentarse o explorar los nuevos aprendizajes."}]}, {"cod": "3.4", "titulo": "Maximizar la memoria y la transferencia de información", "items": [{"id": 64, "text": "Utilizar listas de comprobación, organizadores, notas, let DB = null;

function slug(s){
  return String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9_.~:@+-]+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'') || 'x';
}
function regPath(grupo, nombre, materia){ return 'registros/' + slug(grupo)+'__'+slug(nombre)+'__'+slug(materia); }
function barrPath(grupo, nombre){ return 'barreras/' + slug(grupo)+'__'+slug(nombre); }
function hogPath(grupo, nombre){ return 'hogar/' + slug(grupo)+'__'+slug(nombre); }
function ciePath(grupo, nombre){ return 'cierre/' + slug(grupo)+'__'+slug(nombre); }
function caractPath(grupo, nombre, docente){ return 'caracteristicas/' + slug(grupo)+'__'+slug(nombre)+'__'+slug(docente); }

/* ====== Backend Google Apps Script (para hospedaje fuera de Claude, ej. GitHub Pages) ====== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwK_16yDT8s_gHzOGVKi-iSim9P7dZ-HNfOIud0m41tsurUVtb2uT_FWSmvY-AZxhUg/exec';

let __jsonpCounter = 0;
function gsJsonp_(params){
  return new Promise((resolve, reject) => {
    const cbName = '__gscb_' + (__jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const cleanup = () => { try{ delete window[cbName]; }catch(e){} if(script.parentNode) script.parentNode.removeChild(script); };
    window[cbName] = (result) => { settled = true; cleanup(); resolve(result); };
    const qs = new URLSearchParams(Object.assign({}, params, {callback: cbName})).toString();
    script.src = APPS_SCRIPT_URL + '?' + qs;
    script.onerror = () => { if(!settled){ cleanup(); reject(new Error('No se pudo conectar (JSONP) con Google Apps Script')); } };
    setTimeout(() => { if(!settled){ cleanup(); reject(new Error('Tiempo de espera agotado conectando con Google Apps Script')); } }, 15000);
    document.body.appendChild(script);
  });
}
async function gsFetch_(params){ return await gsJsonp_(params); }
async function gsPost_(body){
  return await gsJsonp_({ action: body.action, key: body.key, data: JSON.stringify(body.data) });
}
const DB_GOOGLE_SHEETS = {
  doc(path){
    return {
      async get(){
        const r = await gsFetch_({action:'get', key: path});
        return { exists: !!r.exists, data: () => r.data };
      },
      async set(data){ await gsPost_({action:'set', key: path, data: data}); }
    };
  },
  collection(path){
    return {
      async get(){
        const r = await gsFetch_({action:'list', prefix: path + '/'});
        return { docs: (r.docs||[]).map(d => ({ id: d.id, data: () => d.data })) };
      }
    };
  }
};

async function getDb(){
  const tieneAppsScript = APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('https://script.google.com') === 0;
  if(tieneAppsScript){
    try{
      await gsFetch_({action:'list', prefix:'__ping__/'});
      return DB_GOOGLE_SHEETS;
    }catch(e){ console.error('No se pudo conectar con Google Apps Script', e); return null; }
  }
  try{
    if(!window.claude || typeof window.claude.use !== 'function') return null;
    return await window.claude.use('db');
  }catch(e){ return null; }
}

async function refreshRegistros(){
  if(!DB) return;
  try{
    const snap = await DB.collection('registros').get();
    const nuevos = {};
    for(const d of snap.docs){
      const data = d.data();
      if(data && data.grupo && data.nombre && data.materia) nuevos[keyFor(data.grupo, data.nombre, data.materia)] = data;
    }
    state.registros = nuevos;
  }catch(e){ console.error(e); }
}

function renderStepAjustes(){
  const key = keyFor(state.estudiante.grupo, state.estudiante.nombre, state.materia);
  const existing = state.registros[key];
  const fase = state.paso3Fase;

  if(fase==='pregunta') return renderPasoPregunta(existing);
  if(fase==='no-justificacion') return renderPasoNoJustificacion(existing);
  if(fase==='si-barreras') return renderPasoSiBarreras();
  if(fase==='si-ajustes') return renderPasoSiAjustes(existing);
  return renderPasoPregunta(existing);
}

function renderCatalogoCompleto(sugeridosSet){
  sugeridosSet = sugeridosSet || new Set();
  const fq = state.filtroAjuste.trim().toLowerCase();
  const pautaBlocks = GRUPOS.map(p=>{
    let visibleItemCount = 0;
    let tieneSugerido = false;
    const subHtml = p.sub.map(sub=>{
      const rows = sub.items.map(it=>{
        const matches = !fq || it.text.toLowerCase().includes(fq);
        if(matches) visibleItemCount++;
        const selKey = String(it.id);
        const esSugerido = sugeridosSet.has(selKey);
        if(esSugerido) tieneSugerido = true;
        const checked = Object.prototype.hasOwnProperty.call(state.detalles, selKey);
        const detailHtml = checked ? renderDetailCard('cat', selKey, state.detalles[selKey]) : '';
        return `<div class="item-wrap ${matches?'':'hidden'}">
          <div class="item-row ${esSugerido?'sugerido':''}">
            <input type="checkbox" id="aj-${selKey}" data-action="toggle-item" data-id="${selKey}" ${checked?'checked':''}>
            <label for="aj-${selKey}">${escapeHtml(it.text)} ${esSugerido?'<span class="badge-sugerido">Sugerido</span>':''}</label>
          </div>
          ${detailHtml}
        </div>`;
      }).join('');
      const subTitle = sub.cod ? `${escapeHtml(sub.cod)} — ${escapeHtml(sub.titulo)}` : escapeHtml(sub.titulo);
      return `<div class="sub-block"><h4>${subTitle}</h4>${rows}</div>`;
    }).join('');
    const selCount = countSelectedInGroup(p);
    const isOpen = state.openPautas.has(String(p.pauta)) || (fq && visibleItemCount>0) || tieneSugerido;
    const isEval = p.pauta === 'EVAL';
    return `<div class="pauta-group ${isOpen?'open':''} ${isEval?'eval-group':''}" data-pauta="${p.pauta}">
      <div class="pauta-head" data-action="toggle-pauta" data-pauta="${p.pauta}">
        <div class="ph-left"><div class="pauta-badge">${isEval?'★':p.pauta}</div><b>${escapeHtml(p.titulo)}</b></div>
        <div style="display:flex;align-items:center;gap:10px;">
          ${tieneSugerido ? `<span class="tag-count" style="background:var(--purple-soft); color:var(--purple);">sugerido aquí</span>` : ''}
          ${selCount>0 ? `<span class="pauta-count">${selCount}</span>` : ''}
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="pauta-body">${subHtml}</div>
    </div>`;
  }).join('');

  return `<div class="search-row"><input class="search-input" id="filtro-ajuste-input" placeholder="Buscar un ajuste específico…" value="${escapeAttr(state.filtroAjuste)}"></div>${pautaBlocks}`;
}

function renderPasoSiAjustes(existing){

  }).join('');

  const sugeridosIds = new Set(Array.from(state.materiaBarrerasSel).flatMap(bid => (MAPA_SUGERENCIAS[bid]||[]).map(String)));

  const customHtml = `<div class="custom-block">

  const totalSel = Object.keys(state.detalles).length + state.personalizados.length;

  return `<div class="panel">
    <div class="panel-head"><div><h2>3. Selecciona los ajustes</h2><p>Para <b>${escapeHtml(state.estudiante.nombre)}</b> en <b>${escapeHtml(state.materia)}</b>. Tú decides — lo marcado como "Sugerido" es solo una pista según las barreras, no un límite.</p></div></div>

      ${totalSel===0 ? `<div class="existing-note" style="background:var(--amber-soft);">Has identificado una barrera, pero todavía no has seleccionado un ajuste razonable para responder a ella. Explora el catálogo de abajo, o guarda igual si por ahora no aplica ninguno.</div>` : ''}
      ${renderCatalogoCompleto(sugeridosIds)}
      ${customHtml}
    </div>
  </div>
  <div class="save-bar">
    <div class="save-count"><b>${totalSel}</b> ajuste(s) seleccionado(s)</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <input id="docente-input" class="search-input" list="docentes-datalist" style="min-width:180px;" placeholder="Tu nombre" value="${escapeAttr(state.docente)}">
      <datalist id="docentes-datalist">${TEACHERS.map(t=>`<option value="${escapeAttr(t.nombre)}">`).join('')}</datalist>
      <button class="btn-primary" data-action="guardar" ${(totalSel===0 || !state.docente.trim())?'disabled':''}>Guardar ajustes</button>
    </div>
  </div>`;
}

function countSelectedInGroup(p){ let c=0; for(const sub of p.sub) for(const it of sub.items) if(Object.prototype.hasOwnProperty.call(state.detalles, String(it.id))) c++; return c; }

function computeMiCobertura(docenteInfo){
  if(!docenteInfo || !docenteInfo.cobertura || docenteInfo.cobertura.length===0) return null;
  const seen = new Set();
  const expected = [];
  const grupos = new Set();
  for(const cov of docenteInfo.cobertura){
    const matching = getAllStudents().filter(s=> cov.grupos ? cov.grupos.includes(s.grupo) : s.grupo.startsWith(cov.grado+'°'));
    for(const s of matching){
      grupos.add(s.grupo);
      const k = s.grupo+'||'+s.nombre+'||'+cov.materia;
      if(!seen.has(k)){ seen.add(k); expected.push({grupo:s.grupo, nombre:s.nombre, materia:cov.materia}); }
    }
  }
  const registrados = expected.filter(p=>!!state.registros[keyFor(p.grupo,p.nombre,p.materia)]);
  const pendientes = expected.filter(p=>!state.registros[keyFor(p.grupo,p.nombre,p.materia)]);
  return { grupos, expected, registrados: registrados.length, total: expected.length, pendientes };
}

function computeDashboard(){
  const diagCounts = {};
  for(const s of getAllStudents()){
    const d = s.diagnostico || 'NO SE TIENE DX';
    diagCounts[d] = (diagCounts[d]||0) + 1;
  }
  const diagStats = Object.entries(diagCounts).map(([diagnostico,count])=>({diagnostico,count})).sort((a,b)=>b.count-a.count);

  const teacherStats = TEACHERS.map(t=>{
    const seen = new Set();
    const expected = [];
    for(const cov of (t.cobertura||[])){
      const matching = getAllStudents().filter(s=> cov.grupos ? cov.grupos.includes(s.grupo) : s.grupo.startsWith(cov.grado+'°'));
      for(const s of matching){
        const k = s.grupo+'||'+s.nombre+'||'+cov.materia;
        if(!seen.has(k)){ seen.add(k); expected.push({grupo:s.grupo, nombre:s.nombre, materia:cov.materia}); }
      }
    }
    const registrados = expected.filter(p=>!!state.registros[keyFor(p.grupo,p.nombre,p.materia)]);
    const pendientes = expected.filter(p=>!state.registros[keyFor(p.grupo,p.nombre,p.materia)]);
    return {
      nombre: t.nombre, sinDatos: (t.cobertura||[]).length===0,
      total: expected.length, registrados: registrados.length, pendientes
    };
  }).filter(t=>t.sinDatos || t.total>0)
    .sort((a,b)=> (b.pendientes.length - a.pendientes.length));

  return {diagStats, teacherStats};
}

function renderDashboard(){
  const {diagStats, teacherStats} = computeDashboard();

  const diagHtml = `<div class="panel" style="margin-bottom:16px;">

    <div class="panel-body">

    </div>
  </div>`;

  const teacherHtml = `<div class="panel" style="margin-bottom:16px;">
    <div class="panel-head"><div><h2 style="font-size:16px;">Cumplimiento por docente</h2><p>Calculado a partir de la asignación horaria — a cuántos estudiantes de inclusión le corresponde registrar, y a cuántos ya les ha diligenciado ajustes.</p></div></div>
    <div class="panel-body">
      <table class="reg-table"><thead><tr><th>Docente</th><th>A cargo</th><th>Registrados</th><th>Avance</th></tr></thead>
      <tbody>${teacherStats.map(t=>{
        if(t.sinDatos) return `<tr><td>${escapeHtml(t.nombre)}</td><td colspan="3" style="color:var(--ink-soft); font-style:italic;">Sin información de grados en la asignación — verificar directamente</td></tr>`;
        const pct = t.total>0 ? Math.round(t.registrados/t.total*100) : 100;
        const pendHtml = t.pendientes.length ? `<details><summary style="cursor:pointer; color:var(--blue); font-weight:600;">Ver ${t.pendientes.length} pendiente(s)</summary>
          <ul class="p-list">${t.pendientes.map(p=>`<li>${escapeHtml(p.nombre)} — ${escapeHtml(p.materia)} (${escapeHtml(p.grupo)})</li>`).join('')}</ul></details>` : '<span style="color:var(--green);">Completo ✓</span>';
        return `<tr><td>${escapeHtml(t.nombre)}</td><td>${t.total}</td><td>${t.registrados}</td><td><span class="tag-count" style="background:${pct===100?'var(--green-soft)':'var(--amber-soft)'}; color:${pct===100?'var(--green)':'#8A6522'};">${pct}%</span><br>${pendHtml}</td></tr>`;
      }).join('')}</tbody></table>
    </div>
  </div>`;

  return diagHtml + teacherHtml;
}

function metaLine(detail){
  const parts = [];
  if(detail.barreraIds && detail.barreraIds.length){
    const txts = detail.barreraIds.map(id=>BARRERA_INFO[id]?BARRERA_INFO[id].text:id);
    parts.push('Barrera(s): '+txts.join('; '));
  }
  if(detail.periodo) parts.push('Periodo: '+detail.periodo);
  return parts.join(' &nbsp;·&nbsp; ');
}

/* ====================== EXPORT ====================== */
function exportarExcel(){
  const rows = [];
  for(const [key, r] of Object.entries(state.registros)){
    const detalle = r.ajustesDetalle || {};
    for(const id of Object.keys(detalle)){
      const info = ID_INFO[id]; if(!info) continue;
      const d = detalle[id];
      rows.push({
        'Grupo': r.grupo, 'Estudiante': r.nombre, 'Materia': r.materia,
        'Tipo de Ajuste': info.ref, 'Ajuste': info.text,
        'Barrera(s)': (d.barreraIds||[]).map(id2=>BARRERA_INFO[id2]?BARRERA_INFO[id2].text:id2).join(' | '),
        'Periodo de aplicación': d.periodo||'', 'Observaciones generales': d.observaciones||'',
        'Docente': r.docente||'', 'Fecha de registro': r.fecha||''
      });
    }
    for(const p of (r.personalizados||[])){
      rows.push({
        'Grupo': r.grupo, 'Estudiante': r.nombre, 'Materia': r.materia,
        'Tipo de Ajuste': 'Personalizado', 'Ajuste': p.text,
        'Barrera(s)': (p.barreraIds||[]).map(id2=>BARRERA_INFO[id2]?BARRERA_INFO[id2].text:id2).join(' | '),
        'Periodo de aplicación': p.periodo||'', 'Observaciones generales': p.observaciones||'',
        'Docente': r.docente||'', 'Fecha de registro': r.fecha||''
      });
    }
  }
  if(rows.length===0){ showToast('Todavía no hay registros para exportar.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:8},{wch:30},{wch:18},{wch:14},{wch:50},{wch:30},{wch:20},{wch:30},{wch:18},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Ajustes Razonables');
  XLSX.writeFile(wb, 'Seguimiento_Ajustes_Razonables.xlsx');
}

/* ====================== HANDLERS ====================== */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.getAttribute('data-action');
    if(!action) return;
    el.addEventListener('click', (ev)=>onAction(action, el, ev));
  });
  document.querySelectorAll('.modal-box').forEach(el=>{
    el.addEventListener('click', (ev)=>ev.stopPropagation());
  });
  bindInput('buscar-input', v=>{ state.busqueda=v; render(); });
  bindInput('filtro-ajuste-input', v=>{ state.filtroAjuste=v; render(); });
  bindInput('resumen-buscar', v=>{ state.busquedaResumen=v; render(); });
  bindInput('barreras-notas-input', v=>{ state.barrerasNotas=v; });
  bindInput('no-observacion-input', v=>{ state.noObservacion=v; });

  function bindDocenteField(id, alsoRenderOnChange){
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', (e)=>{ state.docente = e.target.value; refreshGuardarButtons(); });
    el.addEventListener('change', (e)=>{
      state.docente = e.target.value; persistDocente(state.docente); refreshGuardarButtons();
      if(id==='docente-input-top'){
        const info = getDocenteInfo();
        const mia = computeMiCobertura(info);
        if(mia && (state.filtroGrupo==='Todos')) state.filtroGrupo = 'MIS_GRUPOS';
      }
      if(alsoRenderOnChange) render();
    });
  }
  bindDocenteField('docente-input-top', true);
  bindDocenteField('docente-input', false);
  bindDocenteField('docente-input-inline', false);

  const nuevaMateria = document.getElementById('nueva-materia-input');
  if(nuevaMateria) nuevaMateria.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); agregarMateria(); }});
  const customInput = document.getElementById('custom-ajuste-input');
  if(customInput) customInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); agregarPersonalizado(); }});

  /* Delegated, non-re-rendering field updates for detail-cards and cierre form */
  document.querySelectorAll('[data-field]').forEach(el=>{
    const evName = (el.tagName==='SELECT') ? 'change' : 'input';
    el.addEventListener(evName, (e)=>{
      setFieldValue(el.dataset.scope, el.dataset.key, el.dataset.field, e.target.value);
    });
  });
}

function setFieldValue(scope, key, field, value){
  if(scope==='cat'){
    if(!state.detalles[key]) state.detalles[key] = defaultDetail();
    state.detalles[key][field] = value;
  }else if(scope==='custom'){
    const idx = parseInt(key,10);
    if(state.personalizados[idx]) state.personalizados[idx][field] = value;
  }else if(scope==='cierre'){
    setNested(state.cierreData, field, value);
  }else if(scope==='hogar'){
    setNested(state.hogarData, field, value);
  }else if(scope==='nuevoest'){
    state.nuevoEst[field] = value;
  }
}
function setNested(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}

function refreshGuardarButtons(){
  const totalSel = Object.keys(state.detalles).length + state.personalizados.length;
  const hasDocente = !!(state.docente && state.docente.trim());
  const map = [
    ['guardar', !hasDocente || totalSel===0],
    ['guardar-barreras', !hasDocente],
    ['guardar-hogar', !hasDocente],
    ['guardar-cierre', !hasDocente],
    ['guardar-caracteristicas', !hasDocente],
  ];
  for(const [action, disabled] of map){
    const btn = document.querySelector(`[data-action="${action}"]`);
    if(btn) btn.disabled = disabled;
  }
}

function bindInput(id, onInput){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', (e)=>{
    const pos = e.target.selectionStart;
    onInput(e.target.value);
    const again = document.getElementById(id);
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} }
  });
}

function onAction(action, el){
  if(action==='rol-profesor'){ state.showRoleGate = false; state.tab = 'registrar'; render(); return; }
  if(action==='rol-coordinacion'){ state.showClaveModal = true; state.claveModalIntent = 'rol-coordinacion'; state.claveModalError=''; render(); return; }
  if(action==='cambiar-rol'){ state.showRoleGate = true; state.roleGateError=''; render(); return; }
  if(action==='cancelar-clave'){ state.showClaveModal = false; render(); return; }
  if(action==='confirmar-clave'){
    const input = document.getElementById('clave-input');
    const intento = input ? input.value : '';
    if(intento === COORD_PASSCODE){
      state.coordUnlocked = true; state.showClaveModal = false;
      if(state.claveModalIntent === 'rol-coordinacion'){ state.showRoleGate = false; state.tab = 'resumen'; }
      else { showToast('✓ Modo Coordinación activado.'); }
      state.roleGateError=''; state.claveModalError='';
    }else{
      state.claveModalError = 'Clave incorrecta. Intenta de nuevo.';
    }
    render(); return;
  }
  if(action==='tab'){ state.tab = el.getAttribute('data-tab'); render(); return; }
  if(action==='goto-step'){ state.step = parseInt(el.getAttribute('data-step'),10); render(); return; }
  if(action==='filtro-grupo'){ state.filtroGrupo = el.getAttribute('data-grupo'); render(); return; }
  if(action==='pick-student'){
    const k = el.getAttribute('data-key');
    const [grupo, ...rest] = k.split('|');
    const nombre = rest.join('|');
    const est = getAllStudents().find(s=>s.grupo===grupo && s.nombre===nombre);
    state.estudiante = est; state.step = 2; state.materia=null; state.detalles={}; state.personalizados=[];
    state.materiaBarrerasSel = new Set(); state.noRazones = new Set(); state.noObservacion=''; state.paso3Fase='pregunta';
    render(); return;
  }
  if(action==='cambiar-estudiante'){
    state.estudiante=null; state.materia=null; state.detalles={}; state.personalizados=[]; state.step=1;
    state.materiaBarrerasSel = new Set(); state.noRazones = new Set(); state.noObservacion=''; state.paso3Fase='pregunta';
    render(); return;
  }
  if(action==='pick-materia'){
    state.materia = el.getAttribute('data-materia'); cargarSeleccionExistente(); state.step = 3; state.barrerasActuales = null; render();
    cargarBarrerasActuales(); return;
  }
  if(action==='agregar-materia'){ agregarMateria(); return; }
  if(action==='responder-si'){ state.requiereAjustes = true; state.paso3Fase = state.materiaBarrerasSel.size>0 ? 'si-ajustes' : 'si-barreras'; render(); return; }
  if(action==='responder-no'){ state.requiereAjustes = false; state.paso3Fase = 'no-justificacion'; render(); return; }
  if(action==='volver-pregunta'){ state.paso3Fase = 'pregunta'; render(); return; }
  if(action==='toggle-razon'){
    const id = el.getAttribute('data-id');
    if(state.noRazones.has(id)) state.noRazones.delete(id); else state.noRazones.add(id);
    render(); return;
  }
  if(action==='toggle-materia-barrera'){
    const id = el.getAttribute('data-id');
    if(state.materiaBarrerasSel.has(id)) state.materiaBarrerasSel.delete(id); else state.materiaBarrerasSel.add(id);
    render(); return;
  }
  if(action==='continuar-a-ajustes'){ state.paso3Fase = 'si-ajustes'; render(); return; }
  if(action==='editar-materia-barreras'){ state.paso3Fase = 'si-barreras'; render(); return; }
  if(action==='guardar-no-requiere'){ guardarNoRequiere(); return; }
  if(action==='toggle-pauta'){ const p = el.getAttribute('data-pauta'); if(state.openPautas.has(p)) state.openPautas.delete(p); else state.openPautas.add(p); render(); return; }
  if(action==='toggle-item'){
    const id = el.getAttribute('data-id');
    if(Object.prototype.hasOwnProperty.call(state.detalles,id)) delete state.detalles[id]; else state.detalles[id] = defaultDetail();
    render(); return;
  }
  if(action==='toggle-item-barrera'){
    const scope = el.getAttribute('data-scope'); const key = el.getAttribute('data-key'); const bId = el.getAttribute('data-barrera-id');
    let detail = null;
    if(scope==='cat') detail = state.detalles[key];
    else if(scope==='custom') detail = state.personalizados[parseInt(key,10)];
    if(!detail) return;
    const idx = detail.barreraIds.indexOf(bId);
    if(idx>=0) detail.barreraIds.splice(idx,1); else detail.barreraIds.push(bId);
    render(); return;
  }
  if(action==='agregar-personalizado'){ agregarPersonalizado(); return; }
  if(action==='quitar-personalizado'){ const idx = parseInt(el.getAttribute('data-idx'),10); state.personalizados.splice(idx,1); render(); return; }
  if(action==='guardar'){ guardarRegistro(); return; }
  if(action==='exportar'){ exportarExcel(); return; }
  if(action==='refrescar'){ refreshRegistros().then(()=>{ showToast('Datos actualizados.'); render(); }); return; }
  if(action==='abrir-gestion'){ state.gestionOpen = true; render(); return; }
  if(action==='guardar-estudiante'){ guardarEstudiante(); return; }
  if(action==='editar-registro'){
    if(!state.coordUnlocked){ onAction('pedir-clave', el); return; }
    const key = el.getAttribute('data-key');
    const r = state.registros[key];
    if(!r) return;
    const est = getAllStudents().find(s=>s.grupo===r.grupo && s.nombre===r.nombre) || {grupo:r.grupo, nombre:r.nombre, diagnostico:'', fecha_informe:''};
    state.estudiante = est; state.materia = r.materia;
    state.detalles = JSON.parse(JSON.stringify(r.ajustesDetalle||{}));
    state.personalizados = JSON.parse(JSON.stringify(r.personalizados||[]));
    state.materiaBarrerasSel = new Set(r.materiaBarreras||[]);
    state.noRazones = new Set(r.noRazones||[]); state.noObservacion = r.noObservacion||'';
    state.paso3Fase = r.requiereAjustes===false ? 'no-justificacion' : 'si-ajustes';
    state.tab = 'registrar'; state.step = 3; state.barrerasActuales = null; render();
    cargarBarrerasActuales(); return;
  }
  if(action==='ver-piar'){
    if(!state.coordUnlocked){ onAction('pedir-clave', el); return; }
    const key = el.getAttribute('data-key');
    state.piarKey = key; state.tab = 'piar'; render();
    const [grupo, ...rest] = key.split('|'); const nombre = rest.join('|');
    if(!state.barrerasCache[key]){ fetchBarreras(grupo, nombre).then(data=>{ state.barrerasCache[key] = data || {ids:[], notas:''}; if(state.tab==='piar' && state.piarKey===key) render(); }); }
    if(!state.cierreCache[key]){ fetchCierre(grupo, nombre).then(data=>{ state.cierreCache[key] = data; if(state.tab==='piar' && state.piarKey===key) render(); }); }
    if(!state.hogarCache[key]){
      fetchHogar(grupo, nombre).then(data=>{
        state.hogarCache[key] = data || ENTORNO_HOGAR_IMPORTADO[grupo+'||'+nombre] || null;
        if(state.tab==='piar' && state.piarKey===key) render();
      });
    }
    if(!state.caractCache) state.caractCache = {};
    if(!state.caractCache[key]){
      fetchCaractTodas(grupo, nombre).then(todas=>{
        state.caractCache[key] = todas;
        if(state.tab==='piar' && state.piarKey===key) render();
      });
    }
    return;
  }
  if(action==='volver-resumen'){ state.tab='resumen'; render(); return; }
  if(action==='imprimir'){ window.print(); return; }
  if(action==='ver-barreras'){
    state.barrerasOpen = true; state.barrerasLoading = true; render();
    fetchBarreras(state.estudiante.grupo, state.estudiante.nombre).then(data=>{
      state.barrerasSel = new Set(data ? (data.ids||[]) : []);
      state.barrerasNotas = data ? (data.notas||'') : '';
      state.barrerasMeta = data ? {actualizadoPor: data.actualizadoPor, fecha: data.fecha} : null;
      state.barrerasLoading = false; render();
    });
    return;
  }
  if(action==='cerrar-barreras'){
    state.barrerasOpen = false; state.barrerasActuales = null; render();
    if(state.estudiante) cargarBarrerasActuales();
    return;
  }
  if(action==='toggle-barrera'){
    const id = el.getAttribute('data-id');
    if(state.barrerasSel.has(id)) state.barrerasSel.delete(id); else state.barrerasSel.add(id);
    render(); return;
  }
  if(action==='guardar-barreras'){ guardarBarreras(); return; }
  if(action==='ver-cierre'){
    state.cierreOpen = true; state.cierreLoading = true; render();
    fetchCierre(state.estudiante.grupo, state.estudiante.nombre).then(data=>{
      state.cierreData = data ? Object.assign(defaultCierre(), data) : defaultCierre();
      state.cierreMeta = data ? {actualizadoPor:data.actualizadoPor, fecha:data.fecha} : null;
      state.cierreLoading = false; render();
    });
    return;
  }
  if(action==='cerrar-cierre'){ state.cierreOpen = false; render(); return; }
  if(action==='guardar-cierre'){ guardarCierre(); return; }
  if(action==='ver-hogar'){
    state.hogarOpen = true; state.hogarLoading = true; render();
    fetchHogar(state.estudiante.grupo, state.estudiante.nombre).then(data=>{
      if(data){
        state.hogarData = Object.assign(defaultHogar(), data);
      }else{
        const importKey = state.estudiante.grupo + '||' + state.estudiante.nombre;
        const imported = ENTORNO_HOGAR_IMPORTADO[importKey];
        state.hogarData = Object.assign(defaultHogar(), imported || {});
      }
      state.hogarMeta = data ? {actualizadoPor:data.actualizadoPor, fecha:data.fecha} : null;
      state.hogarLoading = false; render();
    });
    return;
  }
  if(action==='cerrar-hogar'){ state.hogarOpen = false; render(); return; }
  if(action==='guardar-hogar'){ guardarHogar(); return; }
  if(action==='pedir-clave'){ state.showClaveModal = true; state.claveModalIntent = 'pedir-clave'; state.claveModalError=''; render(); return; }
  if(action==='ver-caracteristicas'){
    state.caractOpen = true; state.caractLoading = true; render();
    Promise.all([
      fetchCaractMia(state.estudiante.grupo, state.estudiante.nombre, state.docente || '__sin_nombre__'),
      fetchCaractTodas(state.estudiante.grupo, state.estudiante.nombre)
    ]).then(([mia, todas])=>{
      state.caractSel = new Set(mia ? (mia.ids||[]) : []);
      state.caractTodas = todas;
      state.caractLoading = false; render();
    });
    return;
  }
  if(action==='cerrar-caracteristicas'){ state.caractOpen = false; render(); return; }
  if(action==='toggle-caract'){
    const id = el.getAttribute('data-id');
    if(state.caractSel.has(id)) state.caractSel.delete(id); else state.caractSel.add(id);
    render(); return;
  }
  if(action==='guardar-caracteristicas'){ guardarCaracteristicas(); return; }
}

function cargarSeleccionExistente(){
  const key = keyFor(state.estudiante.grupo, state.estudiante.nombre, state.materia);
  const existing = state.registros[key];
  state.detalles = existing ? JSON.parse(JSON.stringify(existing.ajustesDetalle||{})) : {};
  state.personalizados = existing ? JSON.parse(JSON.stringify(existing.personalizados||[])) : [];
  state.noRazones = new Set(existing && existing.noRazones ? existing.noRazones : []);
  state.noObservacion = existing && existing.noObservacion ? existing.noObservacion : '';
  state.materiaBarrerasSel = new Set(existing && existing.materiaBarreras ? existing.materiaBarreras : []);
  if(!existing){ state.paso3Fase = 'pregunta'; state.requiereAjustes = null; }
  else if(existing.requiereAjustes === false){ state.paso3Fase = 'no-justificacion'; state.requiereAjustes = false; }
  else { state.paso3Fase = 'si-ajustes'; state.requiereAjustes = true; }
}

function agregarMateria(){
  const input = document.getElementById('nueva-materia-input');
  const val = (input.value||'').trim();
  if(!val) return;
  if(!state.materias.includes(val)){ state.materias.push(val); persistMaterias(); }
  state.materia = val; cargarSeleccionExistente(); state.step = 3; state.barrerasActuales = null; render();
  cargarBarrerasActuales();
}

function agregarPersonalizado(){
  const input = document.getElementById('custom-ajuste-input');
  const val = (input.value||'').trim();
  if(!val) return;
  state.personalizados.push(Object.assign({text: val}, defaultDetail()));
  render();
}

async function guardarRegistro(){
  if(!requireDocente()) return;
  const key = keyFor(state.estudiante.grupo, state.estudiante.nombre, state.materia);
  const detallesConBarreras = JSON.parse(JSON.stringify(state.detalles));
  const materiaBarrerasArr = Array.from(state.materiaBarrerasSel);
  for(const id of Object.keys(detallesConBarreras)){ detallesConBarreras[id].barreraIds = materiaBarrerasArr.slice(); }
  for(const p of state.personalizados){ p.barreraIds = materiaBarrerasArr.slice(); }
  const data = { grupo: state.estudiante.grupo, nombre: state.estudiante.nombre, materia: state.materia,
    requiereAjustes: true, materiaBarreras: materiaBarrerasArr,
    ajustesDetalle: detallesConBarreras, personalizados: JSON.parse(JSON.stringify(state.personalizados)),
    docente: state.docente || '', fecha: new Date().toISOString().slice(0,10) };
  try{
    await persistRegistro(key, data);
    state.registros[key] = data;
    await sincronizarBarrerasEstudiante(materiaBarrerasArr);
    let verified = false;
    try{
      const check = await DB.doc(regPath(data.grupo, data.nombre, data.materia)).get();
      if(check.exists){
        const parsed = check.data();
        verified = JSON.stringify(parsed.ajustesDetalle||{}) === JSON.stringify(data.ajustesDetalle) && JSON.stringify(parsed.personalizados||[]) === JSON.stringify(data.personalizados);
      }
    }catch(e){}
    showToast(verified ? '✓ Guardado y confirmado en el servidor — ' + state.estudiante.nombre + ' · ' + state.materia
      : '✓ Guardado localmente. No se pudo confirmar la sincronización; revisa la pestaña Resumen en unos segundos.');
    state.estudiante = null; state.materia = null; state.detalles = {}; state.personalizados = [];
    state.materiaBarrerasSel = new Set(); state.noRazones = new Set(); state.noObservacion = ''; state.paso3Fase = 'pregunta';
    state.step = 1;
  }catch(e){ console.error(e); showToast('⚠ No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.', true); return; }
  render();
}

async function guardarNoRequiere(){
  if(!requireDocente()) return;
  const key = keyFor(state.estudiante.grupo, state.estudiante.nombre, state.materia);
  const data = { grupo: state.estudiante.grupo, nombre: state.estudiante.nombre, materia: state.materia,
    requiereAjustes: false, noRazones: Array.from(state.noRazones), noObservacion: state.noObservacion || '',
    ajustesDetalle: {}, personalizados: [],
    docente: state.docente || '', fecha: new Date().toISOString().slice(0,10) };
  try{
    await persistRegistro(key, data);
    state.registros[key] = data;
    showToast('✓ Guardado — ' + state.estudiante.nombre + ' · ' + state.materia + ' (no requiere ajustes específicos)');
    state.estudiante = null; state.materia = null; state.detalles = {}; state.personalizados = [];
    state.materiaBarrerasSel = new Set(); state.noRazones = new Set(); state.noObservacion = ''; state.paso3Fase = 'pregunta';
    state.step = 1;
  }catch(e){ console.error(e); showToast('⚠ No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.', true); return; }
  render();
}

async function sincronizarBarrerasEstudiante(nuevasBarreras){
  if(!nuevasBarreras.length) return;
  try{
    const existing = await fetchBarreras(state.estudiante.grupo, state.estudiante.nombre);
    const idsActuales = new Set(existing ? (existing.ids||[]) : []);
    let cambiado = false;
    for(const id of nuevasBarreras){ if(!idsActuales.has(id)){ idsActuales.add(id); cambiado = true; } }
    if(cambiado){
      await persistBarreras(state.estudiante.grupo, state.estudiante.nombre, {
        ids: Array.from(idsActuales), notas: existing ? (existing.notas||'') : '',
        actualizadoPor: state.docente || '', fecha: new Date().toISOString().slice(0,10)
      });
    }
  }catch(e){ console.error('No se pudo sincronizar barreras del estudiante', e); }
}

async function guardarEstudiante(){
  const e = state.nuevoEst;
  if(!e.nombre.trim() || !e.grupo.trim()){ showToast('⚠ Nombre y grupo son obligatorios.', true); return; }
  const est = {
    nombre: e.nombre.trim().toUpperCase(), grupo: e.grupo.trim(),
    diagnostico: e.diagnostico.trim() || 'NO SE TIENE DX', fecha_informe: e.fecha_informe.trim()
  };
  const yaExiste = getAllStudents().some(s=>s.nombre===est.nombre && s.grupo===est.grupo);
  if(yaExiste){ showToast('⚠ Ya existe un estudiante con ese nombre y grupo.', true); return; }
  try{
    await persistEstudianteExtra(est);
    state.estudiantesExtra.push(est);
    state.nuevoEst = {nombre:'', grupo:'', diagnostico:'', fecha_informe:''};
    showToast('✓ ' + est.nombre + ' agregado al proceso.');
  }catch(err){ console.error(err); showToast('⚠ No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.', true); return; }
  render();
}

/* Compone un párrafo narrativo a partir de las observaciones de TODOS los docentes */
function componerCaracterizacion(todas){
  if(!todas || todas.length===0) return '';
  const counts = {};
  for(const obs of todas){ for(const id of (obs.ids||[])){ counts[id] = (counts[id]||0) + 1; } }
  const totalDocentes = todas.length;
  const CARACT_INFO = {};
  for(const cat of CARACTERISTICAS){ for(const it of cat.items){ CARACT_INFO[it.id] = {text: it.text, cat: cat.cat}; } }

  const porCategoria = {};
  for(const [id, count] of Object.entries(counts)){
    const info = CARACT_INFO[id]; if(!info) continue;
    if(!porCategoria[info.cat]) porCategoria[info.cat] = [];
    porCategoria[info.cat].push({text: info.text, count});
  }

  const frasesPorCategoria = [];
  for(const cat of CARACTERISTICAS){
    const items = (porCategoria[cat.cat]||[]).filter(x=>x.count >= Math.ceil(totalDocentes/2) || totalDocentes===1);
    if(items.length===0) continue;
    items.sort((a,b)=>b.count-a.count);
    const top = items.slice(0,3).map(x=>x.text.charAt(0).toLowerCase()+x.text.slice(1));
    frasesPorCategoria.push(top.join('; '));
  }
  if(frasesPorCategoria.length===0) return '';
  const nota = totalDocentes>1 ? ` (según la observación de ${totalDocentes} docentes)` : ' (según la observación de 1 docente)';
  return 'Se caracteriza por: ' + frasesPorCategoria.join('. Además, ') + '.' + nota;
}

function requireDocente(){
  if(!state.docente || !state.docente.trim()){
    showToast('⚠ Escribe tu nombre antes de guardar (para saber quién registró esta información).', true);
    return false;
  }
  return true;
}
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 4200);
}
function escapeHtml(str){ if(str===undefined || str===null) return ''; return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }
